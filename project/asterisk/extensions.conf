[general]
static=yes
writeprotect=yes

; Every call (softphone or trunk) lands here.
; Softphone: dial any number, e.g. 100.  Trunk: the DID, with or without "+".
[inbound-ai]
exten => _[+0-9a-z]!,1,NoOp(voicellm call from ${CALLERID(all)} to ${EXTEN})
 same => n,Answer()
 same => n,Wait(0.5)
 ; debugging: asterisk -rx "dialplan set global VL_KEEP_AUDIO 1" keeps call audio in /var/spool/asterisk/voicellm/calls
 same => n,Set(ENV(VA_KEEP_AUDIO)=${GLOBAL(VL_KEEP_AUDIO)})
 same => n,AGI(voice_agent.py)
 same => n,Hangup()

exten => s,1,Goto(inbound-ai,100,1)

; ---------------------------------------------------------------------------
; Outbound campaign calls, placed by the userside dialer through AMI Originate:
;   Channel Local/<number>@voicellm-dialout  ->  once answered: s@outbound-ai
; VL_DIAL_MODE=softphone rings the local test phone (1001) instead of the number.
; ---------------------------------------------------------------------------
[voicellm-dialout]
exten => _[+0-9].,1,NoOp(voicellm dial ${EXTEN} mode=${VL_DIAL_MODE} contact=${VL_CONTACT_ID})
 same => n,GotoIf($["${VL_DIAL_MODE}" = "trunk"]?trunk)
 same => n,GotoIf($["${VL_DIAL_MODE}" = "robot"]?robot)
 same => n,Set(CALLERID(name)=${VL_CAMPAIGN} ${EXTEN})
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()
 same => n(trunk),Dial(PJSIP/${EXTEN}@trunk,45)
 same => n,Hangup()
 ; automated tests: the robot caller (below) answers and speaks VL_QUESTION
 same => n(robot),Dial(Local/s@voicellm-test-caller,30)
 same => n,Hangup()

[outbound-ai]
exten => s,1,NoOp(voicellm outbound contact=${VL_CONTACT_ID})
 same => n,Set(ENV(VA_KEEP_AUDIO)=${GLOBAL(VL_KEEP_AUDIO)})
 same => n,AGI(voice_agent.py)
 same => n,Hangup()

; Robot caller for scripts/test_call_wsl.sh: waits for the greeting, then plays a
; recorded question into the agent and stays on the line for the answer.
[voicellm-test-caller]
exten => s,1,Answer()
 same => n,Wait(${GLOBAL(VL_WAIT)})
 same => n,Playback(${GLOBAL(VL_QUESTION)})
 same => n,Wait(40)
 same => n,Hangup()
