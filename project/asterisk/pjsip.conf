; ---------------------------------------------------------------------------
; voicellm pjsip.conf
; Port 5080 because a softphone on Windows usually takes 5060 itself, and WSL
; mirrored networking shares ports with Windows.
; ---------------------------------------------------------------------------

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5080

; ---------------------------------------------------------------------------
; Local test phone: MicroSIP / Zoiper on this laptop
;   Domain/Server: 127.0.0.1:5080   User: 1001   Password: voicellm1001
; ---------------------------------------------------------------------------
[1001]
type=endpoint
transport=transport-udp
context=inbound-ai
disallow=all
allow=ulaw,alaw
auth=1001-auth
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=voicellm1001

[1001]
type=aor
max_contacts=2
remove_existing=yes

; ---------------------------------------------------------------------------
; SIP trunk (real phone number). Uncomment and fill in when you have one.
; On a cloud VPS also set external_media_address / external_signaling_address
; on the transport, and firewall 5060 to your provider's IPs only.
; ---------------------------------------------------------------------------
;[trunk]
;type=registration
;transport=transport-udp
;outbound_auth=trunk-auth
;client_uri=sip:YOUR_SIP_USERNAME@your-sip-provider.com
;server_uri=sip:your-sip-provider.com
;retry_interval=60
;
;[trunk-auth]
;type=auth
;auth_type=userpass
;username=YOUR_SIP_USERNAME
;password=YOUR_SIP_PASSWORD
;
;[trunk]
;type=aor
;contact=sip:your-sip-provider.com
;
;[trunk]
;type=identify
;endpoint=trunk
;match=your-sip-provider.com
;
;[trunk]
;type=endpoint
;transport=transport-udp
;context=inbound-ai
;disallow=all
;allow=ulaw,alaw
;outbound_auth=trunk-auth
;aors=trunk
;direct_media=no
;rtp_symmetric=yes
;force_rport=yes
